<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>연수 모니터링 실시간 대시보드</title><link href="/assets/ui.css" rel="stylesheet">
<style>
body{font-family:'Malgun Gothic',sans-serif;background:#f0f4f8;overflow:hidden;height:100vh;height:100dvh;display:flex;flex-direction:column}
#grid-container{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:flex-start;padding:10px;gap:8px;overflow:auto}
.student-box{border:1px solid #e2e8f0;border-radius:8px;background:white;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 1px 3px #0000001a;transition:all .2s;cursor:pointer;user-select:none;flex-shrink:0}
.status-Y{background:#d1fae5;border-color:#10b981;color:#065f46}.status-N{background:#ffedd5;border-color:#f97316;color:#9a3412}.has-question{border:4px solid #ef4444!important}.modal{transition:opacity .2s}.dashboard-header{flex-shrink:0;gap:16px}.feedback-text{white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:760px){.dashboard-header{flex-wrap:wrap;padding:12px;gap:10px}.dashboard-header h1{font-size:17px}body{padding:8px!important}.dashboard-header>div:first-child{width:100%}}
</style></head><body class="p-4">
<div id="notice" role="status" class="notice hidden"></div>
<div class="dashboard-header bg-white rounded-xl shadow-sm p-4 mb-4 flex justify-between items-center border">
<div><h1 class="text-xl font-black text-gray-800">연수 모니터링 실시간 대시보드</h1><p id="sync-label" class="text-xs text-gray-500">5초마다 자동 동기화 • 모든 연수생 전수 모니터링</p></div>
<div class="flex items-center space-x-4 bg-gray-50 p-2 rounded-lg border"><button id="prev" onclick="changeCode('prev')" class="bg-white hover:bg-gray-100 border px-4 py-2 rounded font-bold text-sm">◀ 이전</button><div id="admin-code" class="text-2xl font-black text-indigo-600 min-w-[80px] text-center">GH01</div><button id="next" onclick="changeCode('next')" class="bg-white hover:bg-gray-100 border px-4 py-2 rounded font-bold text-sm">다음 ▶</button></div>
<div class="flex gap-4"><div class="text-center"><p class="text-[10px] text-gray-400 font-bold">완료</p><p id="cnt-Y" class="text-xl font-black text-emerald-600">0</p></div><div class="text-center"><p class="text-[10px] text-gray-400 font-bold">미완료</p><p id="cnt-N" class="text-xl font-black text-orange-600">0</p></div><div class="text-center"><p class="text-[10px] text-gray-400 font-bold">질문</p><p id="cnt-Q" class="text-xl font-black text-red-600">0</p></div></div><button onclick="logout()" class="text-xs text-gray-500 border rounded p-2">로그아웃</button>
</div><div id="grid-container"></div>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" class="modal hidden fixed inset-0 flex items-center justify-center z-50"><div class="absolute inset-0 bg-black opacity-50" onclick="closeModal()"></div><div class="bg-white w-11/12 max-w-md mx-auto rounded-xl shadow-2xl z-50 p-6 max-h-[80vh] overflow-y-auto relative"><div class="flex justify-between items-center mb-4 border-b pb-2"><h2 id="modal-title" class="text-lg font-bold"></h2><button onclick="closeModal()" aria-label="닫기" class="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button></div><div id="modal-body" class="space-y-4"></div></div></div>
<div id="admin-login" class="fixed inset-0 flex items-center justify-center z-50" style="background:#f0f4f8"><form id="login-form" class="bg-white rounded-xl shadow-sm p-6 border w-11/12 max-w-md"><h2 class="text-xl font-black text-gray-800 mb-4">강사용 대시보드</h2><input id="password" type="password" autocomplete="current-password" required placeholder="관리자 비밀번호" aria-label="관리자 비밀번호" class="w-full border rounded p-2 mb-4"><button id="login-button" type="submit" class="w-full bg-indigo-600 text-white p-2 rounded font-bold">입장하기</button><p id="login-error" role="alert" class="text-xs text-red-600 mt-2"></p></form></div>
<script src="/assets/common.js"></script><script src="/assets/admin.js"></script></body></html>
